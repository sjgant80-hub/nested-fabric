name: proof
on: [push, pull_request, workflow_dispatch]
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: the fabric, the evaluator, the page and the pins (N6, N7)
        run: node --test test/fabric.test.mjs test/page.test.mjs
      - name: all five scenarios re-run and their logs and shapes re-derived byte for byte (N5)
        run: node tools/fabric.mjs --check
      - name: the held-out record re-derived byte for byte (N1-N4)
        run: node tools/eval.mjs --check
      # Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness - try to break each kernel, then READ the verdict (must be CLEAN, nothing baselined)
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
          for k in fabric eval; do
            node /tmp/witness/witness.mjs mutate "src/$k.mjs" --timeout 240000 --cap 1000 --test node --test test/fabric.test.mjs > "verdict-$k.txt" 2>&1
            tail -3 "verdict-$k.txt"
            grep -q '"clean": true' "verdict-$k.txt" || { echo "::error::mutants survived in src/$k.mjs"; exit 1; }
            node tools/gate-receipt.mjs "$k" "src/$k.mjs" "verdict-$k.txt" --check
          done
